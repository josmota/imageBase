name: Build e release das imagens base

# Fluxo:
#  - Pull request: só faz o build das imagens (não publica), para validar.
#  - Push de tag v* (ex.: v1.0.0): faz build, publica no GHCR e cria a GitHub Release.
#  - Manual (Actions > Run workflow): rebuild e publicação sem criar release,
#    útil para pegar patches de segurança do Ubuntu/Node.
on:
  pull_request:
    paths:
      - "images/**"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      variant:
        description: "Qual imagem reconstruir"
        type: choice
        default: ubuntu26.04-node26
        options:
          - ubuntu26.04-node26
          - ubuntu22.04-node20
          - todas

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/base-image

permissions:
  contents: write   # criar a GitHub Release
  packages: write   # publicar no GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu22.04-node20
            latest: false
          - variant: ubuntu26.04-node26
            latest: true   # a imagem nova recebe também a tag "latest"
    steps:
      - name: Decidir se esta variante roda
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.variant }}" != "todas" ] \
             && [ "${{ inputs.variant }}" != "${{ matrix.variant }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - name: Login no GHCR
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags geradas (exemplo para a tag git v1.2.0):
      #   ghcr.io/<owner>/base-image:ubuntu26.04-node26          (sempre a mais recente da variante)
      #   ghcr.io/<owner>/base-image:ubuntu26.04-node26-v1.2.0   (imutável, use em produção)
      #   ghcr.io/<owner>/base-image:ubuntu26.04-node26-20261023 (rebuilds manuais)
      #   ghcr.io/<owner>/base-image:latest                       (só a variante nova)
      - name: Metadados e tags
        if: steps.gate.outputs.run == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=semver,pattern={{version}},prefix=${{ matrix.variant }}-v
            type=raw,value=${{ matrix.variant }}-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ matrix.latest && github.event_name != 'pull_request' }}

      - name: Build e push
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.variant }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Teste rápido da imagem
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}"
          docker run --rm "$IMG" bash -c "node -v && npm -v && git --version && python3 --version && locale"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Imagens publicadas

            | Variante | Tag fixa desta release |
            |---|---|
            | Ubuntu 26.04 + Node 26 (atual) | `ghcr.io/${{ env.IMAGE_NAME }}:ubuntu26.04-node26-${{ github.ref_name }}` |
            | Ubuntu 22.04 + Node 20 (legado) | `ghcr.io/${{ env.IMAGE_NAME }}:ubuntu22.04-node20-${{ github.ref_name }}` |

            Uso no Dockerfile do projeto:
            ```dockerfile
            FROM ghcr.io/${{ env.IMAGE_NAME }}:ubuntu26.04-node26-${{ github.ref_name }}
            ```
